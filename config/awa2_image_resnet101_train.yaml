# AWA2 full raw-image training with torchvision ResNet-101 and raw
# name_c/attr_c/hier_c/desc_c class descriptions.
# No subset: images are loaded from disk and forwarded through the backbone.

data:
  dataset: "AWA2"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "imagenet"
  batch_size: 24
  num_workers: 4
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "class_desc"
  semantic_embedding_path: null
  semantic_metadata_path: null

model:
  vision:
    freeze: true
    backbone_type: "resnet101"
    pretrained: true
    levels: ["layer2", "layer3", "layer4"]
  semantic:
    freeze: true
    backbone_type: "clip"
    pretrained: true
    clip_model: "./pre-trained/ViT-B-32.pt"
    max_text_len: 77
    input_dim: null
    shared_dim: 512
  aggregator:
    level_dims: [512, 1024, 2048]
    out_dim: 512
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.07
    lambda1: 1.0
    lambda2: 0.1
    lambda3: 0.1

training:
  epochs: 50
  lr: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: "adam"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/awa2_image_resnet101_classdesc"
  log_dir: "./logs/awa2_image_resnet101_classdesc"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

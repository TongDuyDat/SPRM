# CUB full raw-image training with CLIP ViT-B/16 and raw
# name_c/attr_c/hier_c/desc_c class descriptions.

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "clip"
  batch_size: 24
  num_workers: 4
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "class_desc"
  semantic_embedding_path: null
  semantic_metadata_path: null

model:
  vision:
    freeze: true
    backbone_type: "clip_vit_b16"
    clip_model: "ViT-B/16"
    pretrained: true
    levels: null
  semantic:
    freeze: true
    backbone_type: "clip"
    pretrained: true
    clip_model: "./pre-trained/ViT-B-32.pt"
    max_text_len: 77
    input_dim: null
    shared_dim: 512
  aggregator:
    input_dim: 512
    out_dim: 512
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.07
    lambda1: 1.0
    lambda2: 0.1
    lambda3: 0.1

training:
  epochs: 80
  lr: 5.0e-5
  weight_decay: 1.0e-4
  optimizer: "adam"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_image_clip_vit_b16_classdesc"
  log_dir: "./logs/cub_image_clip_vit_b16_classdesc"
  amp: false

eval:
  mode: "both"

feature_level: "pool"

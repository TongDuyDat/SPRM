# CUB Plan 3: unify after-LLM class_desc for train and eval.
# Vision backbone: torchvision ResNet-101 (frozen, multilevel).
# Requires prepared package rebuilt from
# data_semantics/CUB/class_descriptions_cub_after_llm.json

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "imagenet"
  batch_size: 256
  num_workers: 12
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "class_desc"
  semantic_embedding_path: null
  semantic_metadata_path: null

experiment:
  unify_after_llm: true

model:
  vision:
    freeze: true
    backbone_type: "resnet101"
    pretrained: true
    levels: ["layer2", "layer3", "layer4"]
  semantic:
    freeze: true
    backbone_type: "clip"
    pretrained: true
    clip_model: "./pre-trained/ViT-B-32.pt"
    max_text_len: 77
    input_dim: null
    shared_dim: 512
    itemwise_pool: true
  aggregator:
    level_dims: [512, 1024, 2048]
    out_dim: 512
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.07
    lambda1: 1.0
    lambda2: 0.1
    lambda3: 0.1

training:
  epochs: 80
  lr: 1.5e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_r101_plan5_sem"
  log_dir: "./logs/cub_r101_plan5_sem"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

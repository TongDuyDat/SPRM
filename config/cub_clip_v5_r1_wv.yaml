# R1 (HSPRN-A): isolate the visual projector. Same frozen CLIP-pair geometry
# as R0, but Wv is trainable (init = identity, anchored with wv_anchor=0.1).
# Ws stays identity (freeze_Ws), IPR off.
# Diagnostic target: gamma*(t) grows with epochs and u decays (u@ep0 >= u@ep2
# > u@ep80) -> the fitted visual projector recreates the seen-bias even when
# the semantic side is perfectly frozen.

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "clip"
  batch_size: 256
  num_workers: 12
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "class_desc"
  semantic_embedding_path: null
  semantic_metadata_path: null

experiment:
  unify_after_llm: true

model:
  vision:
    freeze: true
    backbone_type: "clip_vit_b32"
    clip_model: "./pre-trained/ViT-B-32.pt"
    pretrained: true
    levels: null
  semantic:
    freeze: true
    freeze_Ws: true
    backbone_type: "clip"
    pretrained: true
    clip_model: "./pre-trained/ViT-B-32.pt"
    max_text_len: 77
    input_dim: null
    shared_dim: 512
    itemwise_pool: true
  aggregator:
    input_dim: 512
    out_dim: 512
    level_dims: [512, 1024, 2048]
    wv_init: "identity"
    freeze_wv: false
    wv_anchor: 0.1
  refiner:
    enabled: false
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.07
    lambda1: 1.0
    lambda2: 0.0
    lambda3: 0.0
    align_mode: "cosine"
    pres_target: "gt"
    pres_mode: "mse"

training:
  epochs: 80
  lr: 1.5e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_clip_v5_r1_wv"
  log_dir: "./logs/cub_clip_v5_r1_wv"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

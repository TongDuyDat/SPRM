# CUB full raw-image training with the registered ViT-B/16 backbone and raw
# name_c/attr_c/hier_c/desc_c class descriptions.

data:
  dataset: "CUB"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "imagenet"
  batch_size: 16
  num_workers: 4
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "class_desc"
  semantic_embedding_path: null
  semantic_metadata_path: "./data_semantics/CUB/class_descriptions_cub.json"

model:
  vision:
    freeze: true
    backbone_type: "vit_base_patch16_224"
    pretrained: true
    levels: ["block_4", "block_8", "tokens_final"]
  semantic:
    freeze: true
    backbone_type: "clip"
    pretrained: true
    clip_model: "./pre-trained/ViT-B-32.pt"
    max_text_len: 77
    input_dim: null
    shared_dim: 512
  aggregator:
    level_dims: [768, 768, 768]
    out_dim: 512
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.07
    lambda1: 1.0
    lambda2: 0.1
    lambda3: 0.1

training:
  epochs: 80
  lr: 5.0e-5
  weight_decay: 1.0e-4
  optimizer: "adam"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_image_vit_base_patch16_classdesc"
  log_dir: "./logs/cub_image_vit_base_patch16_classdesc"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

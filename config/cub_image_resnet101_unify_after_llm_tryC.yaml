# Trial C — mild: chỉ nới temperature + λ2 (ít đụng λ3), gần baseline.
# Dùng nếu Try A/B làm ZSL T1 tụt nhiều.
#
#   python train.py --config config/cub_image_resnet101_unify_after_llm_tryC.yaml \
#     --prepared_root ./prepared_datasets --device cuda --num_workers 2

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "imagenet"
  batch_size: 64
  num_workers: 2
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "class_desc"
  semantic_embedding_path: null
  semantic_metadata_path: null

experiment:
  unify_after_llm: true

model:
  vision:
    freeze: true
    backbone_type: "resnet101"
    pretrained: true
    levels: ["layer2", "layer3", "layer4"]
  semantic:
    freeze: true
    backbone_type: "clip"
    pretrained: true
    clip_model: "./pre-trained/ViT-B-32.pt"
    max_text_len: 77
    input_dim: null
    shared_dim: 512
    itemwise_pool: true
  aggregator:
    level_dims: [512, 1024, 2048]
    out_dim: 512
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.10
    lambda1: 1.0
    lambda2: 0.3
    lambda3: 0.2

training:
  epochs: 50
  lr: 4.0e-5
  weight_decay: 1.5e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_image_resnet101_unify_after_llm_tryC"
  log_dir: "./logs/cub_image_resnet101_unify_after_llm_tryC"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

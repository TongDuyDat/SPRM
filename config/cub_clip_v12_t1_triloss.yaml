# HSPRN-v12 Trial 1 — CUB, CLIP ViT-B/16 — Pure Tri-Loss Formulation
# Kế hoạch chi tiết: docs/KE_HOACH_TRI_LOSS_HSPRN_V12.md
# Loại bỏ hoàn toàn 8 loss cũ chồng chéo và Hard CE seen-only (lambda_cls: 0.0).
# Sử dụng đúng 3 hàm loss cốt lõi không xung đột gradient:
#   (1) lambda_task: 1.0 — Phân loại qua Full-Bank 200-class Zero-Shot Soft KD
#   (2) lambda_visual: 2.0 — Neo giữ đặc trưng thị giác MFA (WiSE-FT Feature Space)
#   (3) lambda_attr: 0.5 — Định hướng IPR qua Cosine Loss 312 thuộc tính
# Gate mục tiêu: u@80 >= 50.0%, T1 >= 73.5%, cal_H >= 65.0%.

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "clip"
  batch_size: 256
  num_workers: 12
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "embedding"
  semantic_embedding_path: "./pre-trained/cub_v8_phi_b16.pt"
  semantic_metadata_path: null

experiment:
  unify_after_llm: false

model:
  vision:
    freeze: true
    backbone_type: "clip_vit_b16"
    clip_model: "./pre-trained/ViT-B-16.pt"
    pretrained: true
    levels: ["block_4", "block_8", "block_12"]
    cls_anchor: true
  semantic:
    freeze: true
    backbone_type: "embedding"
    input_dim: 512
    shared_dim: 512
    ws_rank: 32
    ws_anchor: 0.01
    field_norm: false
  aggregator:
    mode: "anchored"
    level_dims: [768, 768, 768]
    out_dim: 512
  refiner:
    enabled: true
    mode: "cross_attn"
    token_dim: 768
    gate_bias_init: -2.0
    lambda_r_init: 0.05
    cfg_mode: "legacy"
    attribute_query_path: "./pre-trained/cub_attrq_b16.pt"
  loss:
    loss_mode: "tri_loss"
    return_full_output: true
    use_full: true
    temperature: 0.07
    lambda_task: 1.0
    lambda_visual: 2.0
    lambda_attr: 0.5
    attr_loss_type: "cosine"
    lambda_cls: 0.0
    pres_target: "all"

training:
  epochs: 80
  lr: 1.5e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_clip_v12_t1_triloss"
  log_dir: "./logs/cub_clip_v12_t1_triloss"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

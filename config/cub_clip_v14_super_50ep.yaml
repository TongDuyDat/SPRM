# HSPRN-v14 Super-CLIP (50 Epochs, Batch Size 512) — CUB, CLIP ViT-B/16
# Kế hoạch chi tiết: docs/KE_HOACH_HSPRN_V14_SUPER_CLIP.md
# Kiến trúc Local-Global Feature Enhancement:
#   - Global Stream: CLIP CLS + Multi-level Feature Aggregator (W_multi)
#   - Local Stream: IPR Attribute-pooling trên 312 thuộc tính (W_local)
#   - Fusion: v_enhanced = normalize(v_global + W_local(v_local))
#   - Phased Schedule:
#       + Phase 1 (Ep 1 -> 15): Dạy IPR trích xuất 312 thuộc tính bằng L_attr (W_multi=0, W_local=0, Ws=I)
#       + Phase 2 (Ep 16 -> 40): Mở đồng thời W_multi & W_local để học v_enhanced (L_task + 2.0 L_visual + 0.1 L_cls)
#       + Phase 3 (Ep 41 -> 50): Hiệu chỉnh tương quan ngữ nghĩa Ws (L_task + 0.2 L_rel + 0.05 L_cls)
# Mục tiêu tối thượng: u > 60.0%, s > 80.0%, Harmonic Mean H > 70.0%.

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "clip"
  batch_size: 512
  num_workers: 16
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "embedding"
  semantic_embedding_path: "./pre-trained/cub_v8_phi_b16.pt"
  semantic_metadata_path: null

experiment:
  unify_after_llm: false

model:
  vision:
    freeze: true
    backbone_type: "clip_vit_b16"
    clip_model: "./pre-trained/ViT-B-16.pt"
    pretrained: true
    levels: ["block_4", "block_8", "block_12"]
    cls_anchor: true
  semantic:
    freeze: true
    backbone_type: "embedding"
    input_dim: 512
    shared_dim: 512
    ws_rank: 32
    ws_anchor: 0.01
    field_norm: false
  aggregator:
    mode: "anchored"
    level_dims: [768, 768, 768]
    out_dim: 512
  refiner:
    enabled: true
    mode: "cross_attn"
    token_dim: 768
    gate_bias_init: -2.0
    lambda_r_init: 0.05
    cfg_mode: "legacy"
    attribute_query_path: "./pre-trained/cub_attrq_b16.pt"
  loss:
    loss_mode: "tri_loss"
    return_full_output: true
    use_full: true
    temperature: 0.07
    attr_loss_type: "cosine"
    pres_target: "all"

training:
  epochs: 50
  phased_training: true
  phase1_epochs: 15
  phase2_epochs: 40
  lr: 1.5e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 3
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_clip_v14_super_50ep"
  log_dir: "./logs/cub_clip_v14_super_50ep"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

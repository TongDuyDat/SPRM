# E3: v3_noIPR + freeze_Ws (Ws=identity, p_sem = raw CLIP text, frozen).
# Decisive isolation: if seen-bias persists, source is visual side (mfa);
# if it disappears, source is Ws being fitted to seen classes.

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "imagenet"
  batch_size: 256
  num_workers: 12
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "class_desc"
  semantic_embedding_path: null
  semantic_metadata_path: null

experiment:
  unify_after_llm: true

model:
  vision:
    freeze: true
    backbone_type: "resnet101"
    pretrained: true
    levels: ["layer2", "layer3", "layer4"]
  semantic:
    freeze: true
    backbone_type: "clip"
    pretrained: true
    clip_model: "./pre-trained/ViT-B-32.pt"
    max_text_len: 77
    input_dim: null
    shared_dim: 512
    freeze_Ws: true
    itemwise_pool: true
  aggregator:
    level_dims: [512, 1024, 2048]
    out_dim: 512
  refiner:
    enabled: false
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.07
    lambda1: 1.0
    align_mode: "nce"
    pres_target: "all"
    pres_mode: "cosine"
    lambda2: 1.0
    lambda3: 0.2

training:
  epochs: 80
  lr: 1.5e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_r101_v3_noIPR_wsfrozen"
  log_dir: "./logs/cub_r101_v3_noIPR_wsfrozen"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

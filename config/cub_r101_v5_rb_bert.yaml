# R-B (ablation, optional): the WRONG pair — BERT text space x ResNet image
# space. No cross-modal pretraining links these two spaces, and Ws is
# rectangular (768->512) so no identity anchor is even possible.
# Expected: ZSL below R0 and gamma* not smaller than baseline -> evidence
# that multimodal alignment is a property of the PAIR, not of the text
# encoder alone. Requires HF download of bert-base-uncased on the IBM server;
# skip the run if the server has no network.

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "imagenet"
  batch_size: 256
  num_workers: 12
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "class_desc"
  semantic_embedding_path: null
  semantic_metadata_path: null

experiment:
  unify_after_llm: true

model:
  vision:
    freeze: true
    backbone_type: "resnet101"
    pretrained: true
    levels: ["layer2", "layer3", "layer4"]
  semantic:
    freeze: true
    backbone_type: "bert"
    pretrained: true
    pretrained_weights: "bert-base-uncased"
    max_text_len: 128
    input_dim: null
    shared_dim: 512
    itemwise_pool: true
  aggregator:
    level_dims: [512, 1024, 2048]
    out_dim: 512
  refiner:
    enabled: false
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.07
    lambda1: 1.0
    lambda2: 0.0
    lambda3: 0.2
    align_mode: "nce"
    pres_target: "all"
    pres_mode: "cosine"

training:
  epochs: 80
  lr: 1.5e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_r101_v5_rb_bert"
  log_dir: "./logs/cub_r101_v5_rb_bert"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

# Trial D — sửa hàm loss (không chỉ tăng trọng số).
# Vấn đề quan sát được: L_align chỉ kéo về prototype của lớp GT (không có
# negative) và L_pres chỉ tính trên hàng GT của vector đã L2-normalize nên giá
# trị ~0.0004, gradient gần như chết; CE với tau nhỏ chiếm ~95%+ budget loss.
# Thay đổi chính so với tryA:
#   align_mode cosine -> nce      (softmax trên 150 lớp seen: kéo đúng lớp,
#                                  đẩy xa các lớp seen còn lại)
#   pres_target gt -> all         (L_pres trên toàn bộ class, chống IPR drift)
#   pres_mode mse -> cosine       (bất biến scale với vector đã chuẩn hóa)
#   lambda2 0.5, lambda3 1.0      (NCE-align có cùng scale với CE nên thực sự
#                                  cạnh tranh được với L_cls)
#   lambda1 0.75                  (giữ đúng tỉ lệ bộ lambda người dùng đang chạy)
#
# Chạy:
#   python train.py --config config/cub_image_resnet101_unify_after_llm_tryD.yaml \
#     --prepared_root ./prepared_datasets --device cuda --num_workers 2

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "imagenet"
  batch_size: 64
  num_workers: 2
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "class_desc"
  semantic_embedding_path: null
  semantic_metadata_path: null

experiment:
  unify_after_llm: true

model:
  vision:
    freeze: true
    backbone_type: "resnet101"
    pretrained: true
    levels: ["layer2", "layer3", "layer4"]
  semantic:
    freeze: true
    backbone_type: "clip"
    pretrained: true
    clip_model: "./pre-trained/ViT-B-32.pt"
    max_text_len: 77
    input_dim: null
    shared_dim: 512
    itemwise_pool: true
  aggregator:
    level_dims: [512, 1024, 2048]
    out_dim: 512
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.12
    lambda1: 0.75
    lambda2: 0.5
    lambda3: 1.0
    align_mode: "nce"
    pres_target: "all"
    pres_mode: "cosine"

training:
  epochs: 50
  lr: 3.0e-5
  weight_decay: 2.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_image_resnet101_unify_after_llm_tryD"
  log_dir: "./logs/cub_image_resnet101_unify_after_llm_tryD"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

# Trial B — align/pres mạnh hơn Try A (nếu Try A vẫn cls-dominate / u thấp).
# So baseline: τ↑, λ2=λ3=1.0, lr thấp hơn, epochs 45.
#
# Chạy sau Try A nếu Cal H chưa tăng hoặc log vẫn pres << cls:
#   python train.py --config config/cub_image_resnet101_unify_after_llm_tryB.yaml \
#     --prepared_root ./prepared_datasets --device cuda --num_workers 2

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "imagenet"
  batch_size: 64
  num_workers: 2
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "class_desc"
  semantic_embedding_path: null
  semantic_metadata_path: null

experiment:
  unify_after_llm: true

model:
  vision:
    freeze: true
    backbone_type: "resnet101"
    pretrained: true
    levels: ["layer2", "layer3", "layer4"]
  semantic:
    freeze: true
    backbone_type: "clip"
    pretrained: true
    clip_model: "./pre-trained/ViT-B-32.pt"
    max_text_len: 77
    input_dim: null
    shared_dim: 512
    itemwise_pool: true
  aggregator:
    level_dims: [512, 1024, 2048]
    out_dim: 512
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.15
    lambda1: 1.0
    lambda2: 1.0
    lambda3: 1.0

training:
  epochs: 45
  lr: 2.5e-5
  weight_decay: 2.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_image_resnet101_unify_after_llm_tryB"
  log_dir: "./logs/cub_image_resnet101_unify_after_llm_tryB"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

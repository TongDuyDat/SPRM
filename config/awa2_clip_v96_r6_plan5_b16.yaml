# HSPRN-v9.6 R6-style — AWA2, CLIP ViT-B/16 — TRAIN voi semantic bank (refiner OFF).
# = pattern cub_clip_v9_r6b_noref_v8phi_b16.yaml (CUB): moi thu giong classdesc
# config tru: semantic_source=embedding + phi file + refiner off + lambda_sem 2.0.
# phi duoc sinh boi: python tools/precompute_class_phi.py \
#     --config config/awa2_clip_v96_hsprn_b16.yaml \
#     --prepared_root ./prepared_datasets --output ./pre-trained/awa2_v96_phi_b16.pt

data:
  dataset: "AWA2"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "clip"
  batch_size: 256
  num_workers: 12
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "embedding"
  semantic_embedding_path: "./pre-trained/awa2_v96_phi_b16.pt"
  semantic_metadata_path: null

experiment:
  unify_after_llm: false

model:
  vision:
    freeze: true
    backbone_type: "clip_vit_b16"
    clip_model: "./pre-trained/ViT-B-16.pt"
    pretrained: true
    levels: null
  semantic:
    freeze: true
    backbone_type: "embedding"
    input_dim: 512
    shared_dim: 512
    ws_rank: 32
    ws_anchor: 0.01
    field_norm: false
  aggregator:
    input_dim: 512
    out_dim: 512
    level_dims: [512, 1024, 2048]
    wv_init: "identity"
    freeze_wv: true
  refiner:
    enabled: false
    gate_bias_init: -2.0
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.07
    lambda1: 1.0
    lambda2: 0.1
    lambda3: 0.5
    lambda_sem: 2.0
    lambda_trans: 0.25
    tau_teacher: 0.1
    align_mode: "nce"
    pres_target: "all"
    pres_mode: "cosine"

training:
  epochs: 80
  lr: 1.5e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/awa2_clip_v96_r6_plan5_b16"
  log_dir: "./logs/awa2_clip_v96_r6_plan5_b16"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

# HSPRN-v11 E3 — CUB, CLIP ViT-B/16 — E2 fix: freeze λ_r (CFG đúng nghĩa) + λ_tan chặt hơn.
# Bài học E2 (logs/v11_e3_cub.log): λ_r học được tự phình 0.05 -> 0.186 và
# u sụp về 31.2 (tệ hơn E1 39.6) — training vẫn tìm kênh seen-margin qua
# phần image-conditioned của residual. Trong CFG thật (Ho & Salimans),
# guidance scale là hyperparameter CỐ ĐỊNH. Đối chứng bất ngờ: eval cùng
# weights E2 mà KHÔNG trừ r(∅) (buffer non-persistent bị rơi) lại cho
# u 48.6@ep80, u 54.8 / H 55.4 / γ 0.00 @ep32 — residual λ_r dương không
# phá unseen như v10 (λ_r âm), phần phá nằm ở amplification.
# Thay đổi so với E2 (cub_clip_v11_e3_b16.yaml):
#   (1) lambda_r_freeze: true — λ_r cố định 0.05 (CFG đúng nghĩa; khởi tạo
#       dương nhỏ vì E0 cho thấy residual có giá trị ảnh-thuần-dương).
#   (2) lambda_tan 0.25 (E2: 0.1) — chặt hơn: tan loss ở E2 ~0.037 tức góc
#       ~20 độ mỗi prototype, quá rộng; budget chặt buộc uốn chọn lọc.
#   Giữ nguyên Fix 1 (L_fm 1.0) + Fix 3 (L_zs 0.5) + Fix 4 (L_rel 0.1)
#   và cfg_mode "cfg" + null condition trainval (như E2).
# Gate: u@80 >= 50, T1 >= 74, H >= 56, cal_H >= 64.4.

data:
  dataset: "CUB"
  source: "prepared"
  prepared_root: "./prepared_datasets"
  data_root: "./data"
  image_root: "./datasets"
  mode: "image"
  image_size: 224
  image_preprocess: "clip"
  batch_size: 256
  num_workers: 12
  subset_size: null
  eval_subset_size: null
  drop_last: false
  semantic_source: "embedding"
  semantic_embedding_path: "./pre-trained/cub_v8_phi_b16.pt"
  semantic_metadata_path: null

experiment:
  unify_after_llm: false

model:
  vision:
    freeze: true
    backbone_type: "clip_vit_b16"
    clip_model: "./pre-trained/ViT-B-16.pt"
    pretrained: true
    levels: ["block_4", "block_8", "block_12"]
    cls_anchor: true
  semantic:
    freeze: true
    backbone_type: "embedding"
    input_dim: 512
    shared_dim: 512
    ws_rank: 32
    ws_anchor: 0.01
    field_norm: false
  aggregator:
    mode: "anchored"
    level_dims: [768, 768, 768]
    out_dim: 512
  refiner:
    enabled: true
    mode: "cross_attn"
    token_dim: 768
    gate_bias_init: -2.0
    lambda_r_init: 0.05          # guidance scale dương nhỏ (E0: image-conditioned part có giá trị dương)
    cfg_mode: "cfg"              # Fix 2a: residual r(V) - r(null)
    lambda_r_freeze: true         # E2 lesson: freeze guidance scale (CFG đúng nghĩa Ho & Salimans)
    attribute_query_path: "./pre-trained/cub_attrq_b16.pt"
  loss:
    return_full_output: true
    use_full: true
    temperature: 0.07
    lambda1: 1.0
    lambda2: 0.1
    lambda3: 0.5
    lambda_sem: 2.0
    lambda_trans: 0.0        # Fix 3: OFF — thay bằng lambda_zs
    tau_teacher: 0.1
    align_mode: "nce"
    pres_target: "all"
    pres_mode: "cosine"
    lambda_attn: 0.3
    lambda_fm: 1.0           # Fix 1 (BẮT BUỘC)
    lambda_zs: 0.5           # Fix 3 (BẮT BUỘC)
    lambda_rel: 0.1          # Fix 4 (BẮT BUỘC)
    lambda_tan: 0.25         # Fix 2b chặt hơn (E2: 0.1 cho góc ~20đ — quá rộng)

training:
  epochs: 80
  lr: 1.5e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  seed: 42
  eval_freq: 1
  save_dir: "./checkpoints/cub_clip_v11_e3_b16"
  log_dir: "./logs/cub_clip_v11_e3_b16"
  amp: false

eval:
  mode: "both"

feature_level: "multilevel"

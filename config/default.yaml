# ============================================================
# HSPRN Default Configuration
# ============================================================
# Per-dataset configs inherit from this and override as needed.

data:
  dataset: "AWA2"
  source: "legacy"              # legacy | prepared
  prepared_root: "./prepared_datasets"
  data_root: "./data"            # root dir containing xlsa17 dataset folders
  image_root: "./datasets"       # root dir containing raw downloaded image datasets
  image_size: 224
  batch_size: 64
  num_workers: 4
  # "image"   = raw images; forward pass goes through the configured backbone
  # "feature" = pre-extracted ResNet-101 features from xlsa17
  mode: "image"
  subset_size: null
  eval_subset_size: null
  image_preprocess: "imagenet"   # imagenet | clip
  # auto: semantic_embedding_path -> embedding, semantic_metadata_path -> class_desc,
  # otherwise xlsa17 attributes.
  semantic_source: "auto"         # auto | class_desc | embedding | attribute
  # Optional cached class semantic embeddings. Use only when explicitly training
  # the semantic tensor path.
  semantic_embedding_path: null
  # JSON with raw name_c/attr_c/hier_c/desc_c records, produced by
  # tools/generate_descriptions.py. Plan 3 prefers
  # data_semantics/<DS>/class_descriptions_<ds>_after_llm.json (never overwrite legacy).
  semantic_metadata_path: null

# Experiment-level protocol flags (Plan 3, etc.)
experiment:
  # When true: force semantic_source=class_desc for train+eval, require full
  # after-LLM fields for every class (seen+unseen), prefer itemwise pool encode.
  unify_after_llm: false

model:
  vision:
    backbone_type: "vit_base_patch16_224"
    pretrained: true
    freeze: false
    # Optional explicit level selection per-arch.
    # For ResNet: ['res1','res3','res4'] or ['layer1','layer3','layer4']
    # For ViT: ['block_4','block_8','tokens_final','cls']
    levels: null
  semantic:
    # For data.semantic_source=class_desc, use clip/tinyclip/sbert/bert.
    # and keep input_dim null. For attribute/embedding tensors, train.py sets
    # input_dim from the loaded semantic matrix.
    backbone_type: "embedding"
    pretrained: false
    freeze: false
    pretrained_weights: null
    input_dim: null
    text_dim: 768
    shared_dim: 85
    # Plan 3: encode list items separately + mean-pool (avoids CLIP 77-token join).
    itemwise_pool: false
  aggregator:
    input_dim: 2048
    dim_l: 768
    dim_m: 768
    dim_h: 768
    out_dim: 85
  loss:
    temperature: 0.07
    lambda1: 1.0   # L_cls
    lambda2: 0.1   # L_align
    lambda3: 0.1   # L_pres
    # "cosine" = paper Eq. (34) (GT only); "nce" = softmax over all seen
    # classes so L_align has real discriminative gradient.
    align_mode: "cosine"
    # "gt" = paper Eq. (35) (GT row only); "all" = every class prototype.
    pres_target: "gt"
    # "mse" = paper Eq. (35); "cosine" = scale-invariant on unit vectors.
    pres_mode: "mse"
    # API flags
    return_full_output: true   # model.forward returns HSPRNOutput
    use_full: true             # trainer uses Eq. (32), (34)-(36)


training:
  epochs: 50
  lr: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: "adam"               # adam | adamw | sgd
  scheduler: "cosine"            # cosine | step | none
  warmup_epochs: 5
  seed: 42
  eval_freq: 1                   # evaluate every N epochs
  save_dir: "./checkpoints"
  log_dir: "./logs"
  amp: false                     # mixed precision

eval:
  mode: "both"                   # zsl | gzsl | both

feature_level: "multilevel"
